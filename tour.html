<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tour Interativo 360° — Lumitria</title>
  <link rel="icon" type="image/x-icon" href="para-vriaricone.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="libs/pannellum/pannellum.css">
  <script src="libs/pannellum/pannellum.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ouro:      #C9A96E;
      --ouro-glow: rgba(201,169,110,0.30);
      --dark:      #F5F4F0;
      --ui-bg:     rgba(250,249,246,0.88);
      --text:      #1A1A1A;
      --text-2:    #777;
      --border:    rgba(180,160,120,0.25);
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #F5F4F0; font-family: 'Josefin Sans', 'Inter', system-ui, sans-serif;
      color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
    }

    #panorama, #panorama-b {
      position: fixed; inset: 0; width: 100%; height: 100%;
      transform-origin: center center;
    }
    #panorama   { z-index: 11; }
    #panorama-b { z-index: 10; }

    /* Cena saindo: zoom pra frente + fade */
    .pano-leaving {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.8, 1),
                  opacity   0.38s ease !important;
      transform: scale(1.32) !important;
      opacity: 0 !important;
    }

    .pnlm-ui .pnlm-about-msg,
    .pnlm-ui .pnlm-zoom-controls { display: none !important; }

    /* ── Transição ── */
    #transition {
      position: fixed; inset: 0; z-index: 150;
      background: #F5F4F0; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #transition.active { opacity: 1; pointer-events: all; }

    /* ── Loading ── */
    #loadScreen {
      position: fixed; inset: 0; z-index: 500; background: #F5F4F0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; transition: opacity 0.7s;
    }
    #loadScreen.gone { opacity: 0; pointer-events: none; }
    #loadScreen img { width: 54px; height: 54px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.35);
      box-shadow: 0 0 20px rgba(201,169,110,0.15); }
    .bar-track { width: 190px; height: 1px; background: rgba(0,0,0,0.10);
      border-radius: 2px; overflow: hidden; }
    #loadBar { height: 100%; width: 0%; border-radius: 2px;
      background: var(--ouro); transition: width 0.3s; }
    .load-txt { font-size: 0.70rem; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; }

    /* ── Header ── */
    #topBar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 28px 16px;
      background: transparent;
      pointer-events: none;
    }
    #topBar > * { pointer-events: all; }
    .logo-lnk { display: flex; align-items: center; text-decoration: none; }
    .logo-lnk img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(201,169,110,0.30); }
    #sceneLabel {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.70rem; font-weight: 300; color: var(--text-2);
      letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--ui-bg); border: 1px solid var(--border);
      padding: 7px 18px; border-radius: 100px; backdrop-filter: blur(16px);
    }
    .ldot { width: 5px; height: 5px; border-radius: 50%; background: var(--ouro);
      flex-shrink: 0; animation: blink 2.4s ease-in-out infinite; }
    #backBtn {
      display: flex; align-items: center; gap: 7px;
      background: var(--ui-bg); border: 1px solid var(--border);
      color: var(--text-2); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.70rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 7px 18px; border-radius: 100px; cursor: pointer;
      backdrop-filter: blur(16px); text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    #backBtn:hover { color: var(--text); border-color: var(--ouro); }

    /* ── Nav de cenas ── */
    #sceneNav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: transparent;
    }
    .nav-inner {
      display: flex; align-items: center; gap: 4px;
      background: var(--ui-bg); border: 1px solid var(--border);
      padding: 10px 20px; border-radius: 100px; backdrop-filter: blur(20px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .sbtn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; opacity: 0.35; transition: opacity 0.3s;
      background: none; border: none; padding: 6px 14px; color: inherit; min-width: 64px;
    }
    .sbtn:hover { opacity: 0.65; }
    .sbtn.on  { opacity: 1; }
    .pip { width: 5px; height: 5px; border-radius: 50%; background: #ccc;
      transition: background 0.3s, transform 0.3s; }
    .sbtn.on .pip { background: var(--ouro); transform: scale(1.3); }
    .plbl { font-family: 'Josefin Sans', sans-serif; font-size: 0.58rem; font-weight: 300;
      letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap;
      color: var(--text-2); transition: color 0.3s; }
    .sbtn.on .plbl { color: var(--text); font-weight: 600; }
    .ndiv { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; align-items: center; gap: 6px;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.65rem; font-weight: 300;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-2); pointer-events: none;
      transition: opacity 1.2s; white-space: nowrap;
    }
    #hint.gone { opacity: 0; }

    /* ── Overlay de entrada ── */
    #overlay {
      position: fixed; inset: 0; z-index: 300;
      background: #08090F;
      transition: opacity 0.9s;
    }
    #overlay.gone { opacity: 0; pointer-events: none; }

    /* Foto de fundo — placeholder enquanto panorama carrega */
    .ov-bg {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
      opacity: 0.38;
      transition: opacity 1.5s ease;
    }
    .ov-bg img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      display: block;
    }
    .ov-night {
      position: absolute; inset: 0;
      animation: daynight 8s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    .ov-night img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
    }
    @keyframes daynight {
      0%,5%{opacity:0} 30%,70%{opacity:1} 95%,100%{opacity:0}
    }

    /* Gradiente escuro para leitura do texto */
    .ov-grad {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        linear-gradient(to right, rgba(8,9,15,0.65) 0%, transparent 62%),
        linear-gradient(to top, rgba(8,9,15,0.88) 0%, rgba(8,9,15,0.08) 50%, transparent 72%);
    }

    /* ── Seleção de tour (overlay central) ── */
    .ov-select {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 40px; text-align: center;
    }
    .ov-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.68rem; font-weight: 300; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(240,237,232,0.85);
      border: 1px solid rgba(201,169,110,0.38);
      padding: 6px 16px; border-radius: 100px;
      background: rgba(8,9,15,0.32);
      margin-bottom: 20px;
    }
    .ov-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--ouro);
      animation: blink 2.4s ease-in-out infinite; flex-shrink: 0;
    }
    .ov-select h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 2.8vw, 2.6rem); font-weight: 700;
      line-height: 1.08; color: #fff; letter-spacing: -0.01em;
      margin-bottom: 24px; white-space: nowrap;
    }
    .ov-select h1 em {
      font-style: italic; color: #EFD99A;
      text-shadow: 0 2px 24px rgba(220,190,100,0.30);
    }

    /* Grid de cards */
    .tours-grid {
      display: flex; gap: 28px; align-items: stretch;
    }

    /* Card base — agora é div, não button */
    .tour-card {
      width: clamp(360px, 44vw, 640px);
      background: rgba(8,9,15,0.62);
      border: 1px solid rgba(201,169,110,0.28);
      border-radius: 20px; overflow: hidden;
      text-align: left;
      display: flex; flex-direction: column;
      backdrop-filter: blur(18px);
      transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1),
                  border-color 0.25s, box-shadow 0.32s;
    }
    .tour-card:hover {
      transform: translateY(-10px);
      border-color: rgba(201,169,110,0.70);
      box-shadow: 0 32px 80px rgba(0,0,0,0.60), 0 0 0 1px rgba(201,169,110,0.15);
    }

    /* Thumb — área interativa do panorama */
    .tour-card-thumb {
      height: min(40vh, 340px); overflow: hidden; position: relative; flex-shrink: 0;
      cursor: grab;
    }
    .tour-card-thumb:active { cursor: grabbing; }

    /* panorama preview dentro do card — totalmente interativo */
    .card-panorama {
      width: 100%; height: 100%;
    }
    .card-panorama .pnlm-container { border-radius: 0 !important; }
    .tour-card-grad {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to bottom, transparent 55%, rgba(8,9,15,0.70) 100%);
      pointer-events: none;
    }
    .tour-card-rooms {
      position: absolute; bottom: 10px; right: 12px;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.58rem;
      font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(240,237,232,0.80);
      background: rgba(8,9,15,0.55); border: 1px solid rgba(201,169,110,0.30);
      padding: 4px 10px; border-radius: 100px; backdrop-filter: blur(8px);
    }
    .tour-card-thumb--dark {
      background: rgba(8,9,15,0.50);
      display: flex; align-items: center; justify-content: center;
    }
    .soon-icon { color: rgba(201,169,110,0.35); }

    /* Info — área clicável para iniciar o tour */
    .tour-card-info {
      padding: 18px 22px 22px;
      display: flex; flex-direction: column; gap: 7px; flex: 1;
      background: none; border: none; text-align: left; color: inherit;
      cursor: pointer; width: 100%;
      border-top: 1px solid rgba(201,169,110,0.12);
      transition: background 0.2s;
    }
    .tour-card-info:hover { background: rgba(201,169,110,0.06); }
    .tc-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.58rem;
      font-weight: 300; letter-spacing: 0.20em; text-transform: uppercase;
      padding: 3px 11px; border-radius: 100px; width: fit-content;
    }
    .tc-tag.available {
      color: var(--ouro); border: 1px solid rgba(201,169,110,0.40);
      background: rgba(201,169,110,0.10);
    }
    .tc-tag.soon {
      color: rgba(240,237,232,0.40);
      border: 1px solid rgba(240,237,232,0.14);
    }
    .tc-dot {
      width: 4px; height: 4px; border-radius: 50%; background: var(--ouro);
      animation: blink 2.4s ease-in-out infinite; flex-shrink: 0;
    }
    .tour-card-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem; font-weight: 700;
      color: #fff; line-height: 1.2; margin-top: 2px;
    }
    .tour-card-info p {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.70rem; font-weight: 300;
      color: rgba(240,237,232,0.55); letter-spacing: 0.06em; line-height: 1.75;
    }
    .tc-cta {
      margin-top: auto; padding-top: 14px;
      display: flex; align-items: center; gap: 7px;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.65rem;
      font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ouro);
    }
    .tc-cta--muted { color: rgba(240,237,232,0.28); }

    /* Toast "em breve" */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(16px);
      z-index: 400; opacity: 0; pointer-events: none;
      background: rgba(8,9,15,0.88); border: 1px solid rgba(201,169,110,0.40);
      color: rgba(240,237,232,0.90); backdrop-filter: blur(16px);
      font-family: 'Josefin Sans', sans-serif; font-size: 0.68rem;
      font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 12px 28px; border-radius: 100px;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    .tour-card-info {
      padding: 22px 28px 28px;
    }
    .tour-card-info h3 {
      font-size: 1.5rem;
    }
    .tour-card-info p {
      font-size: 0.78rem;
    }

    @media (max-width: 900px) {
      .tours-grid { flex-direction: column; gap: 16px; align-items: center; }
      .tour-card { width: min(560px, 92vw); }
      .tour-card-thumb { height: min(34vh, 240px); }
      .ov-select { padding: 20px 20px; justify-content: center; overflow-y: auto; }
      .ov-select h1 { font-size: clamp(1.5rem, 6vw, 2rem); margin-bottom: 20px; }
    }

    /* ── Hotspots ── */
    .hs-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
    .hs-circle {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(201,169,110,0.15); border: 2px solid rgba(201,169,110,0.85);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(201,169,110,0.35);
      position: relative; transition: transform 0.2s, background 0.2s;
    }
    .hs-circle::before {
      content: ''; position: absolute; width: 70px; height: 70px; border-radius: 50%;
      border: 2px solid rgba(201,169,110,0.40);
      animation: hs-pulse 2s ease-in-out infinite;
    }
    .hs-circle svg { color: var(--ouro); filter: drop-shadow(0 0 4px var(--ouro)); }
    .hs-wrap:hover .hs-circle { transform: scale(1.12); background: rgba(201,169,110,0.28); }
    .hs-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.62rem; font-weight: 300; color: #1A1A1A;
      letter-spacing: 0.16em; text-transform: uppercase;
      background: rgba(245,244,240,0.90); border: 1px solid rgba(180,160,120,0.35);
      padding: 5px 14px; border-radius: 100px; white-space: nowrap; backdrop-filter: blur(8px);
    }

    @media (max-width: 480px) {
      #topBar { padding: max(14px, env(safe-area-inset-top)) 16px 14px; }
      .logo-lnk img { width: 36px; height: 36px; }
      #sceneLabel { font-size: 0.70rem; padding: 6px 12px; }
      #backBtn { font-size: 0.72rem; padding: 6px 12px; }
      #backBtn span { display: none; }
      #overlay h1 { font-size: clamp(1.7rem, 8vw, 2.6rem); }
      #overlay p { font-size: 0.88rem; margin-bottom: 30px; }
      #hint { bottom: 100px; font-size: 0.66rem; }
      .nav-inner { padding: 10px 14px; }
      .sbtn { padding: 6px 10px; min-width: 52px; }
    }

    /* ── Planta baixa ── */
    #plantaBox {
      position: fixed; bottom: 80px; left: 20px; z-index: 200;
      width: 210px;
      background: rgba(8,9,15,0.84); border: 1px solid rgba(201,169,110,0.28);
      border-radius: 12px; overflow: hidden; backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transform-origin: bottom left;
      transition: opacity 0.4s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      cursor: pointer;
    }
    #plantaBox:hover, #plantaBox.zoomed {
      transform: scale(1.3);
      box-shadow: 0 16px 48px rgba(0,0,0,0.65);
      border-color: rgba(201,169,110,0.50);
    }
    #plantaBox.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 600px) {
      /* Hotspot menor no mobile */
      .hs-circle { width: 36px; height: 36px; }
      .hs-circle::before { width: 52px; height: 52px; }
      .hs-circle svg { width: 14px; height: 14px; }
      .hs-label { font-size: 0.55rem; padding: 3px 10px; letter-spacing: 0.10em; }

      /* Planta: 50% menor no mobile */
      #plantaBox {
        width: 72px;
        bottom: 90px; left: 12px;
        transform-origin: bottom left;
      }
      #plantaBox.zoomed {
        transform: scale(2.6);
      }
      .planta-header { display: none; }
      .planta-wrap { padding: 4px; }

      /* Nav: scrollável horizontalmente */
      #sceneNav {
        padding-left: 0; padding-right: 0;
      }
      .nav-inner {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        border-radius: 0;
        border-left: none; border-right: none;
        padding: 10px 16px;
        gap: 2px;
        max-width: 100%;
      }
      .nav-inner::-webkit-scrollbar { display: none; }
      .sbtn { min-width: 52px; padding: 6px 10px; flex-shrink: 0; }
      .ndiv { flex-shrink: 0; }
    }
    .planta-header {
      padding: 7px 12px; border-bottom: 1px solid rgba(201,169,110,0.15);
      font-size: 0.58rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ouro);
      display: flex; align-items: center; gap: 6px;
    }
    @media (max-width: 768px) {
      .planta-header { display: none !important; }
      #plantaBox {
        background: transparent !important;
        border: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      .planta-wrap { padding: 0 !important; }
    }
    .planta-wrap { position: relative; padding: 8px; }
    .planta-wrap img { width: 100%; display: block; opacity: 0.90; }
    .room-dot {
      position: absolute;
      width: 8px; height: 8px; border-radius: 50%;
      background: transparent; border: none;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
    }
    .room-dot.active {
      opacity: 1; pointer-events: all;
    }
    /* Núcleo do marcador */
    .room-dot.active::before {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      background: #00BFFF;
      box-shadow: 0 0 6px 1px rgba(0,191,255,0.8);
    }
    /* Anel pulsante externo */
    .room-dot.active::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1.5px solid rgba(0,191,255,0.60);
      animation: radar-ping 2.8s ease-out infinite;
    }
    @keyframes radar-ping {
      0%   { transform: translate(-50%,-50%) scale(0.6); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(2.4); opacity: 0;   }
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes hs-pulse {
      0%   { transform: scale(1);    opacity: 0.7; }
      60%  { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1);    opacity: 0; }
    }
  </style>
</head>
<body>

<div id="panorama"></div>
<div id="panorama-b"></div>
<div id="transition"></div>

<!-- Planta baixa -->
<div id="plantaBox">
  <div class="planta-header">
    <span class="ldot"></span> Planta Baixa
  </div>
  <div class="planta-wrap" id="plantaWrap">
    <img src="https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778362145/vamos_tentat_essa-removebg-preview_an8cmw.png" alt="Planta Baixa">
    <div class="room-dot active" id="dot-0" style="left:53%; top:40%;"></div>
    <div class="room-dot" id="dot-1" style="left:27%; top:47%;"></div>
    <div class="room-dot" id="dot-2" style="left:64%; top:40%;"></div>
    <div class="room-dot" id="dot-3" style="left:50%; top:14%;"></div>
    <div class="room-dot" id="dot-4" style="left:54%; top:76%;"></div>
    <div class="room-dot" id="dot-5" style="left:81%; top:43%;"></div>
    <div class="room-dot" id="dot-6" style="left:18%; top:42%;"></div>
  </div>
</div>

<div id="loadScreen">
  <img src="assets/images/logo-lumitria.png" alt="Lumitria">
  <div class="bar-track"><div id="loadBar"></div></div>
  <span class="load-txt" id="loadTxt">Carregando experiência…</span>
</div>

<header id="topBar">
  <a href="folder.html" class="logo-lnk">
    <img src="assets/images/logo-lumitria.png" alt="Lumitria">
  </a>
  <div id="sceneLabel">
    <span class="ldot"></span>
    <span id="sceneName">Tour 360°</span>
  </div>
  <a href="folder.html" id="backBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none">

</header>

<div id="hint">

<nav id="sceneNav">

</nav>

<div id="overlay">

  <!-- Foto do prédio dia/noite — some quando panorama termina de carregar -->
  <div class="ov-bg" id="ovBg">
    <img src="https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778173958/ChatGPT_Image_7_de_mai._de_2026_14_12_15_yskl7y.png" alt="Capa dia">
    <div class="ov-night">
      <img src="https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778637817/ChatGPT_Image_12_de_mai._de_2026_23_03_29_ruc90u.png" alt="Capa noite">
    </div>
  </div>

  <div class="ov-grad"></div>

  <!-- Seleção de tour -->
  <div class="ov-select">
    <div class="ov-tag">
      <span class="ov-dot"></span>
      Tour Interativo 360°
    </div>
    <h1>Escolha sua <em>experiência</em></h1>

    <div class="tours-grid">

      <!-- Card 1 — Apartamento Decorado -->
      <div class="tour-card">
        <div class="tour-card-thumb">
          <div id="preview-decorador" class="card-panorama"></div>
          <div class="tour-card-grad"></div>
          <span class="tour-card-rooms">7 ambientes</span>
        </div>
        <button class="tour-card-info" onclick="startTour('decorador')">
          <span class="tc-tag available"><span class="tc-dot"></span>Disponível agora</span>
          <h3>Apartamento<br>Decorado</h3>
          <p>Sala, suítes, cozinha, varanda e escritório — experiência completa</p>
          <span class="tc-cta">
            Iniciar Tour
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- Card 2 — Áreas Sociais -->
      <div class="tour-card">
        <div class="tour-card-thumb">
          <div id="preview-social" class="card-panorama"></div>
          <div class="tour-card-grad"></div>
          <span class="tour-card-rooms">7 ambientes</span>
        </div>
        <button class="tour-card-info" onclick="startTour('social')">
          <span class="tc-tag available"><span class="tc-dot"></span>Disponível agora</span>
          <h3>Áreas Sociais<br>do Empreendimento</h3>
          <p>Explore os espaços comuns — piscina, salão e lazer</p>
          <span class="tc-cta">
            Iniciar Tour
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>

    </div>
  </div>

</div>

<div id="toast">Em breve — aguarde novidades!</div>

<script>
'use strict';

var SCENES = [
  {
    name: 'Sala de Estar', navLabel: 'Sala',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778624798/Panorama14_000_g51d7d.png',
    hotspots: [
      { pitch: 0, yaw: -155, to: 2, label: 'Cozinha'    },
      { pitch: 0, yaw: -103, to: 4, label: 'Hall'       },
      { pitch: 0, yaw: -25,  to: 1, label: 'Suíte'      },
      { pitch: 0, yaw:  80,  to: 3, label: 'Varanda'    },
      { pitch: 0, yaw:  148, to: 5, label: 'Escritório' }
    ]
  },
  {
    name: 'Suíte Master', navLabel: 'Suíte',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622880/Panorama19_j8vkzb.png',
    hotspots: [
      { pitch: 0, yaw:  0,  to: 6, label: 'Suíte II' },
      { pitch: -5, yaw: 148, to: 2, label: 'Cozinha'  }
    ]
  },
  {
    name: 'Cozinha', navLabel: 'Cozinha',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622878/Panorama16_wmnge5.png',
    hotspots: [
      { pitch: -12, yaw: -54, to: 4, label: 'Hall'    },
      { pitch: -15, yaw:   4, to: 0, label: 'Sala'    },
      { pitch: -10, yaw:  43, to: 3, label: 'Varanda' }
    ]
  },
  {
    name: 'Varanda Gourmet', navLabel: 'Varanda',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778629788/Panorama17_000_e9dlqw.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Hall', navLabel: 'Hall',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778636419/Panorama18_000_oou86z.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Escritório', navLabel: 'Escritório',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778636099/Panorama21_bnwrvg.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Suíte II', navLabel: 'Suíte II',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622879/Panorama20_iyt8tj.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 1, label: 'Suíte' }
    ]
  }
];

var SCENES_DECORADOR = SCENES; /* referência fixa antes de qualquer reassignment */
var viewer    = null;   /* viewer ativo (front) */
var viewerBk  = null;   /* viewer carregando (back) */
var frontPano = 'panorama';
var backPano  = 'panorama-b';
var previewViewers = { decorador: null, social: null };
var curIdx = 0;
var transitioning = false;
var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 600;
var BASE_HFOV = isMobile ? 90 : 100;

(function () {
  var ls = document.getElementById('loadScreen');
  if (ls) ls.style.display = 'none';
}());

function buildHotspots(sceneIdx) {
  return SCENES[sceneIdx].hotspots.map(function (hs) {
    return {
      pitch: hs.pitch, yaw: hs.yaw, type: 'custom', cssClass: 'hs-wrap',
      createTooltipFunc: function (el) {
        el.innerHTML =
          '<div class="hs-circle">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none">' +
              '<path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</div>' +
          '<span class="hs-label">' + hs.label + '</span>';
      },
      clickHandlerFunc: function () { goTo(hs.to); }
    };
  });
}

function goTo(idx) {
  if (idx === curIdx || transitioning) return;
  transitioning = true;
  curIdx = idx;
  updateNav(idx);
  document.getElementById('sceneName').textContent = SCENES[idx].name;

  /* destrói buffer anterior se ainda estava carregando */
  if (viewerBk) { viewerBk.destroy(); viewerBk = null; }

  /* carrega nova cena no buffer de trás (invisível) */
  viewerBk = pannellum.viewer(backPano, {
    type: 'equirectangular',
    panorama: SCENES[idx].src,
    autoLoad: true,
    autoRotate: -2,
    autoRotateInactivityDelay: 3000,
    showControls: false,
    draggable: true, mouseZoom: true, keyboardZoom: true,
    hfov: BASE_HFOV, minHfov: 60, maxHfov: 130,
    pitch: 0, yaw: 0,
    hotSpots: buildHotspots(idx)
  });

  var switched = false;
  function switchNow() {
    if (switched) return;
    switched = true;

    var frontEl = document.getElementById(frontPano);

    /* zoom pra frente + fade na cena atual */
    frontEl.classList.add('pano-leaving');

    setTimeout(function () {
      /* destrói viewer antigo */
      if (viewer) { viewer.destroy(); viewer = null; }
      frontEl.classList.remove('pano-leaving');

      /* troca buffers */
      var tmp = frontPano; frontPano = backPano; backPano = tmp;
      viewer   = viewerBk;
      viewerBk = null;

      document.getElementById(frontPano).style.zIndex = '11';
      document.getElementById(backPano ).style.zIndex = '10';

      transitioning = false;
    }, 460);
  }

  viewerBk.on('load', switchNow);
  setTimeout(switchNow, 12000); /* fallback se a imagem demorar */
}

function updateNav(idx) {
  document.querySelectorAll('.sbtn').forEach(function (b) {
    b.classList.toggle('on', parseInt(b.dataset.scene) === idx);
  });
  document.querySelectorAll('.room-dot').forEach(function (d) {
    d.classList.toggle('active', d.id === 'dot-' + idx);
  });
}

var SCENES_SOCIAL = [
  {
    name: 'Fachada 1',     navLabel: 'Fachada 1',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778867849/Panorama13_rdfovi.png',
    hotspots: []
  },
  {
    name: 'Fachada 2',     navLabel: 'Fachada 2',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778867849/Panorama14_qmajfb.png',
    hotspots: []
  },
  {
    name: 'Circulação',    navLabel: 'Circulação',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778867855/Panorama18_dprzeg.png',
    hotspots: []
  },
  {
    name: 'Circulação 2',  navLabel: 'Circulação 2',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1779145603/Panorama20_tgnfn3.png',
    hotspots: []
  },
  {
    name: 'Living',        navLabel: 'Living',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1779145603/Panorama21_uojuq5.png',
    hotspots: []
  },
  {
    name: 'Living 2',      navLabel: 'Living 2',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1779032256/Panorama14_001_vwidyu.png',
    hotspots: []
  },
  {
    name: 'Spa',           navLabel: 'Spa',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778938579/Panorama13_vqygzs.png',
    hotspots: []
  },
];

function initPreviews() {
  var opts = {
    type: 'equirectangular', autoLoad: true,
    autoRotate: -0.5, autoRotateInactivityDelay: 3000,
    showControls: false, mouseZoom: false, draggable: true,
    hfov: 100, minHfov: 100, maxHfov: 100, pitch: 0, yaw: 0
  };
  previewViewers.decorador = pannellum.viewer('preview-decorador',
    Object.assign({}, opts, { panorama: SCENES_DECORADOR[0].src }));
  previewViewers.social = pannellum.viewer('preview-social',
    Object.assign({}, opts, { panorama: SCENES_SOCIAL[0].src }));
}
initPreviews();

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2800);
}

function startTour(type) {
  /* libera os viewers de preview */
  ['decorador', 'social'].forEach(function(k) {
    if (previewViewers[k]) { previewViewers[k].destroy(); previewViewers[k] = null; }
  });
  if (type === 'social') {
    if (!SCENES_SOCIAL.length) {
      showToast('Em breve — aguarde novidades!');
      return;
    }
    SCENES = SCENES_SOCIAL;
    curIdx = 0;
    buildNav();
    document.getElementById('plantaBox').classList.add('hidden');
    document.getElementById('sceneName').textContent = SCENES[0].name;
    initViewer(0);
  }
  var ov = document.getElementById('overlay');
  ov.classList.add('gone');
  setTimeout(function () { ov.style.display = 'none'; }, 950);
  setTimeout(function () { document.getElementById('hint').classList.add('gone'); }, 7000);
}

function buildNav() {
  var inner = document.querySelector('.nav-inner');
  inner.innerHTML = '';
  SCENES.forEach(function (scene, i) {
    if (i > 0) {
      var sep = document.createElement('div');
      sep.className = 'ndiv';
      inner.appendChild(sep);
    }
    var btn = document.createElement('button');
    btn.className = 'sbtn' + (i === 0 ? ' on' : '');
    btn.dataset.scene = i;
    var label = scene.navLabel || scene.name.split(' ')[0];
    btn.innerHTML = '<div class="pip"></div><span class="plbl">' + label + '</span>';
    btn.addEventListener('click', (function (idx) {
      return function () { goTo(idx); };
    }(i)));
    inner.appendChild(btn);
  });
}

/* Quando o panorama termina de carregar, a foto some e o viewer aparece */
function initViewer(sceneIdx, onLoaded) {
  if (viewer) { viewer.destroy(); viewer = null; }
  viewer = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: SCENES[sceneIdx].src,
    autoLoad: true,
    autoRotate: -2,
    autoRotateInactivityDelay: 3000,
    showControls: false,
    draggable: true,
    mouseZoom: true,
    keyboardZoom: true,
    hfov: BASE_HFOV,
    minHfov: 60,
    maxHfov: 130,
    pitch: 0, yaw: 0,
    hotSpots: buildHotspots(sceneIdx)
  });
  viewer.on('load', function () {
    if (typeof onLoaded === 'function') onLoaded();
  });
  setTimeout(function () {
    if (typeof onLoaded === 'function') onLoaded();
  }, 9000);
}

initViewer(0);

/* Planta: zoom no toque (mobile e desktop) */
(function () {
  var box = document.getElementById('plantaBox');
  if (!box) return;
  box.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    box.classList.add('zoomed');
  }, { passive: true });
  box.addEventListener('touchend', function () {
    setTimeout(function () { box.classList.remove('zoomed'); }, 800);
  });
}());
</script>
</body>
</html>
