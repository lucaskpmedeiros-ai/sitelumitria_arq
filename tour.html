<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tour Interativo 360° — Lumitria</title>
  <link rel="icon" type="image/x-icon" href="para-vriaricone.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="libs/pannellum/pannellum.css">
  <script src="libs/pannellum/pannellum.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ouro:      #C9A96E;
      --ouro-glow: rgba(201,169,110,0.30);
      --dark:      #F5F4F0;
      --ui-bg:     rgba(250,249,246,0.88);
      --text:      #1A1A1A;
      --text-2:    #777;
      --border:    rgba(180,160,120,0.25);
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #F5F4F0; font-family: 'Josefin Sans', 'Inter', system-ui, sans-serif;
      color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
    }

    #panorama { position: fixed; inset: 0; width: 100%; height: 100%; }

    .pnlm-ui .pnlm-about-msg,
    .pnlm-ui .pnlm-zoom-controls { display: none !important; }

    /* ── Transição ── */
    #transition {
      position: fixed; inset: 0; z-index: 150;
      background: #F5F4F0; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #transition.active { opacity: 1; pointer-events: all; }

    /* ── Loading ── */
    #loadScreen {
      position: fixed; inset: 0; z-index: 500; background: #F5F4F0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; transition: opacity 0.7s;
    }
    #loadScreen.gone { opacity: 0; pointer-events: none; }
    #loadScreen img { width: 54px; height: 54px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.35);
      box-shadow: 0 0 20px rgba(201,169,110,0.15); }
    .bar-track { width: 190px; height: 1px; background: rgba(0,0,0,0.10);
      border-radius: 2px; overflow: hidden; }
    #loadBar { height: 100%; width: 0%; border-radius: 2px;
      background: var(--ouro); transition: width 0.3s; }
    .load-txt { font-size: 0.70rem; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; }

    /* ── Header ── */
    #topBar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 28px 16px;
      background: linear-gradient(to bottom, rgba(245,244,240,0.95) 0%, transparent 100%);
      pointer-events: none;
    }
    #topBar > * { pointer-events: all; }
    .logo-lnk { display: flex; align-items: center; text-decoration: none; }
    .logo-lnk img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(201,169,110,0.30); }
    #sceneLabel {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.70rem; font-weight: 300; color: var(--text-2);
      letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--ui-bg); border: 1px solid var(--border);
      padding: 7px 18px; border-radius: 100px; backdrop-filter: blur(16px);
    }
    .ldot { width: 5px; height: 5px; border-radius: 50%; background: var(--ouro);
      flex-shrink: 0; animation: blink 2.4s ease-in-out infinite; }
    #backBtn {
      display: flex; align-items: center; gap: 7px;
      background: var(--ui-bg); border: 1px solid var(--border);
      color: var(--text-2); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.70rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 7px 18px; border-radius: 100px; cursor: pointer;
      backdrop-filter: blur(16px); text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    #backBtn:hover { color: var(--text); border-color: var(--ouro); }

    /* ── Nav de cenas ── */
    #sceneNav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(245,244,240,0.95) 0%, transparent 100%);
    }
    .nav-inner {
      display: flex; align-items: center; gap: 4px;
      background: var(--ui-bg); border: 1px solid var(--border);
      padding: 10px 20px; border-radius: 100px; backdrop-filter: blur(20px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .sbtn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; opacity: 0.35; transition: opacity 0.3s;
      background: none; border: none; padding: 6px 14px; color: inherit; min-width: 64px;
    }
    .sbtn:hover { opacity: 0.65; }
    .sbtn.on  { opacity: 1; }
    .pip { width: 5px; height: 5px; border-radius: 50%; background: #ccc;
      transition: background 0.3s, transform 0.3s; }
    .sbtn.on .pip { background: var(--ouro); transform: scale(1.3); }
    .plbl { font-family: 'Josefin Sans', sans-serif; font-size: 0.58rem; font-weight: 300;
      letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap;
      color: var(--text-2); transition: color 0.3s; }
    .sbtn.on .plbl { color: var(--text); font-weight: 600; }
    .ndiv { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; align-items: center; gap: 6px;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.65rem; font-weight: 300;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-2); pointer-events: none;
      transition: opacity 1.2s; white-space: nowrap;
    }
    #hint.gone { opacity: 0; }

    /* ── Overlay de entrada ── */
    #overlay {
      position: fixed; inset: 0; z-index: 300; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(245,244,240,0.97); backdrop-filter: blur(24px);
      transition: opacity 0.9s; padding: 24px; text-align: center;
    }
    #overlay.gone { opacity: 0; pointer-events: none; }
    .ov-tag {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem; font-weight: 300; color: var(--ouro);
      border: 1px solid rgba(201,169,110,0.40);
      padding: 6px 18px; border-radius: 100px; margin-bottom: 32px;
      letter-spacing: 0.22em; text-transform: uppercase;
    }
    #overlay h1 {
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 100;
      line-height: 1.15; color: var(--text); letter-spacing: -0.01em;
      margin-bottom: 18px; max-width: 560px;
    }
    #overlay h1 em { font-style: normal; font-weight: 300; color: var(--ouro); }
    #overlay p {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem; color: var(--text-2); max-width: 420px;
      line-height: 1.80; margin-bottom: 44px; font-weight: 300;
    }
    #startBtn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #1A1A1A; color: #F5F4F0;
      font-family: 'Josefin Sans', sans-serif; font-size: 0.75rem;
      font-weight: 300; letter-spacing: 0.20em; text-transform: uppercase;
      padding: 16px 40px; border-radius: 3px; border: none; cursor: pointer;
      transition: transform 0.22s, background 0.22s;
    }
    #startBtn:hover { transform: translateY(-2px); background: #333; }

    /* ── Hotspots ── */
    .hs-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
    .hs-circle {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(201,169,110,0.15); border: 2px solid rgba(201,169,110,0.85);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(201,169,110,0.35);
      position: relative; transition: transform 0.2s, background 0.2s;
    }
    .hs-circle::before {
      content: ''; position: absolute; width: 70px; height: 70px; border-radius: 50%;
      border: 2px solid rgba(201,169,110,0.40);
      animation: hs-pulse 2s ease-in-out infinite;
    }
    .hs-circle svg { color: var(--ouro); filter: drop-shadow(0 0 4px var(--ouro)); }
    .hs-wrap:hover .hs-circle { transform: scale(1.12); background: rgba(201,169,110,0.28); }
    .hs-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.62rem; font-weight: 300; color: #1A1A1A;
      letter-spacing: 0.16em; text-transform: uppercase;
      background: rgba(245,244,240,0.90); border: 1px solid rgba(180,160,120,0.35);
      padding: 5px 14px; border-radius: 100px; white-space: nowrap; backdrop-filter: blur(8px);
    }

    @media (max-width: 480px) {
      #topBar { padding: max(14px, env(safe-area-inset-top)) 16px 14px; }
      .logo-lnk img { width: 36px; height: 36px; }
      #sceneLabel { font-size: 0.70rem; padding: 6px 12px; }
      #backBtn { font-size: 0.72rem; padding: 6px 12px; }
      #backBtn span { display: none; }
      #overlay h1 { font-size: clamp(1.7rem, 8vw, 2.6rem); }
      #overlay p { font-size: 0.88rem; margin-bottom: 30px; }
      #hint { bottom: 100px; font-size: 0.66rem; }
      .nav-inner { padding: 10px 14px; }
      .sbtn { padding: 6px 10px; min-width: 52px; }
    }

    /* ── Planta baixa ── */
    #plantaBox {
      position: fixed; bottom: 80px; left: 20px; z-index: 200;
      width: 210px;
      background: rgba(8,9,15,0.84); border: 1px solid rgba(201,169,110,0.28);
      border-radius: 12px; overflow: hidden; backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transform-origin: bottom left;
      transition: opacity 0.4s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      cursor: pointer;
    }
    #plantaBox:hover, #plantaBox.zoomed {
      transform: scale(1.3);
      box-shadow: 0 16px 48px rgba(0,0,0,0.65);
      border-color: rgba(201,169,110,0.50);
    }
    #plantaBox.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 600px) {
      /* Hotspot menor no mobile */
      .hs-circle { width: 36px; height: 36px; }
      .hs-circle::before { width: 52px; height: 52px; }
      .hs-circle svg { width: 14px; height: 14px; }
      .hs-label { font-size: 0.55rem; padding: 3px 10px; letter-spacing: 0.10em; }

      /* Planta: 50% menor no mobile */
      #plantaBox {
        width: 72px;
        bottom: 90px; left: 12px;
        transform-origin: bottom left;
      }
      #plantaBox.zoomed {
        transform: scale(2.6);
      }
      .planta-header { display: none; }
      .planta-wrap { padding: 4px; }

      /* Nav: scrollável horizontalmente */
      #sceneNav {
        padding-left: 0; padding-right: 0;
      }
      .nav-inner {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        border-radius: 0;
        border-left: none; border-right: none;
        padding: 10px 16px;
        gap: 2px;
        max-width: 100%;
      }
      .nav-inner::-webkit-scrollbar { display: none; }
      .sbtn { min-width: 52px; padding: 6px 10px; flex-shrink: 0; }
      .ndiv { flex-shrink: 0; }
    }
    .planta-header {
      padding: 7px 12px; border-bottom: 1px solid rgba(201,169,110,0.15);
      font-size: 0.58rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ouro);
      display: flex; align-items: center; gap: 6px;
    }
    @media (max-width: 768px) {
      .planta-header { display: none !important; }
      #plantaBox {
        background: transparent !important;
        border: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      .planta-wrap { padding: 0 !important; }
    }
    .planta-wrap { position: relative; padding: 8px; }
    .planta-wrap img { width: 100%; display: block; opacity: 0.90; }
    .room-dot {
      position: absolute;
      width: 8px; height: 8px; border-radius: 50%;
      background: transparent; border: none;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
    }
    .room-dot.active {
      opacity: 1; pointer-events: all;
    }
    /* Núcleo do marcador */
    .room-dot.active::before {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      background: #00BFFF;
      box-shadow: 0 0 6px 1px rgba(0,191,255,0.8);
    }
    /* Anel pulsante externo */
    .room-dot.active::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1.5px solid rgba(0,191,255,0.60);
      animation: radar-ping 2.8s ease-out infinite;
    }
    @keyframes radar-ping {
      0%   { transform: translate(-50%,-50%) scale(0.6); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(2.4); opacity: 0;   }
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes hs-pulse {
      0%   { transform: scale(1);    opacity: 0.7; }
      60%  { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1);    opacity: 0; }
    }
  </style>
</head>
<body>

<div id="panorama"></div>
<div id="transition"></div>

<!-- Planta baixa -->
<div id="plantaBox">
  <div class="planta-header">
    <span class="ldot"></span> Planta Baixa
  </div>
  <div class="planta-wrap" id="plantaWrap">
    <img src="https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778362145/vamos_tentat_essa-removebg-preview_an8cmw.png" alt="Planta Baixa">
    <div class="room-dot active" id="dot-0" style="left:53%; top:40%;"></div>
    <div class="room-dot" id="dot-1" style="left:27%; top:47%;"></div>
    <div class="room-dot" id="dot-2" style="left:64%; top:40%;"></div>
    <div class="room-dot" id="dot-3" style="left:50%; top:14%;"></div>
    <div class="room-dot" id="dot-4" style="left:54%; top:76%;"></div>
    <div class="room-dot" id="dot-5" style="left:81%; top:43%;"></div>
    <div class="room-dot" id="dot-6" style="left:18%; top:42%;"></div>
  </div>
</div>

<div id="loadScreen">
  <img src="assets/images/logo-lumitria.png" alt="Lumitria">
  <div class="bar-track"><div id="loadBar"></div></div>
  <span class="load-txt" id="loadTxt">Carregando experiência…</span>
</div>

<header id="topBar">
  <a href="folder.html" class="logo-lnk">
    <img src="assets/images/logo-lumitria.png" alt="Lumitria">
  </a>
  <div id="sceneLabel">
    <span class="ldot"></span>
    <span id="sceneName">Tour 360°</span>
  </div>
  <a href="folder.html" id="backBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
      <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Voltar ao folder</span>
  </a>
</header>

<div id="hint">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
    <path d="M7 7c0-2.8 2.2-5 5-5s5 2.2 5 5v5c0 2.8-2.2 5-5 5s-5-2.2-5-5V7z"
      stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  Arraste para explorar
</div>

<nav id="sceneNav">
  <div class="nav-inner">
    <button class="sbtn on" data-scene="0" onclick="goTo(0)">
      <div class="pip"></div><span class="plbl">Sala</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="1" onclick="goTo(1)">
      <div class="pip"></div><span class="plbl">Suíte</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="6" onclick="goTo(6)">
      <div class="pip"></div><span class="plbl">Suíte II</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="2" onclick="goTo(2)">
      <div class="pip"></div><span class="plbl">Cozinha</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="3" onclick="goTo(3)">
      <div class="pip"></div><span class="plbl">Varanda</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="4" onclick="goTo(4)">
      <div class="pip"></div><span class="plbl">Hall</span>
    </button>
    <div class="ndiv"></div>
    <button class="sbtn" data-scene="5" onclick="goTo(5)">
      <div class="pip"></div><span class="plbl">Escritório</span>
    </button>
  </div>
</nav>

<div id="overlay">
  <div class="ov-tag"><span class="ldot"></span>Tour Interativo 360°</div>
  <h1>Explore o projeto<br><em>como nunca antes.</em></h1>
  <p>Navegue pelos ambientes, descubra cada detalhe e visualize o espaço com total clareza — antes da primeira pedra ser assentada.</p>
  <button id="startBtn" onclick="startTour()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M5 3l14 9-14 9V3z" fill="currentColor"/>
    </svg>
    Iniciar tour 3D
  </button>
</div>

<script>
'use strict';

var SCENES = [
  {
    name: 'Sala de Estar',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778624798/Panorama14_000_g51d7d.png',
    hotspots: [
      { pitch: 0, yaw: -155, to: 2, label: 'Cozinha'    },
      { pitch: 0, yaw: -103, to: 4, label: 'Hall'       },
      { pitch: 0, yaw: -25,  to: 1, label: 'Suíte'      },
      { pitch: 0, yaw:  80,  to: 3, label: 'Varanda'    },
      { pitch: 0, yaw:  148, to: 5, label: 'Escritório' }
    ]
  },
  {
    name: 'Suíte Master',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622880/Panorama19_j8vkzb.png',
    hotspots: [
      { pitch: 0, yaw:  0,  to: 6, label: 'Suíte II' },
      { pitch: -5, yaw: 148, to: 2, label: 'Cozinha'  }
    ]
  },
  {
    name: 'Cozinha',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622878/Panorama16_wmnge5.png',
    hotspots: [
      { pitch: -12, yaw: -54, to: 4, label: 'Hall'    },
      { pitch: -15, yaw:   4, to: 0, label: 'Sala'    },
      { pitch: -10, yaw:  43, to: 3, label: 'Varanda' }
    ]
  },
  {
    name: 'Varanda Gourmet',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778629788/Panorama17_000_e9dlqw.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Hall',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778636419/Panorama18_000_oou86z.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Escritório',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778636099/Panorama21_bnwrvg.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 0, label: 'Sala' }
    ]
  },
  {
    name: 'Suíte II',
    src: 'https://res.cloudinary.com/dzn9q1rkt/image/upload/v1778622879/Panorama20_iyt8tj.png',
    hotspots: [
      { pitch: 0, yaw: 0, to: 1, label: 'Suíte' }
    ]
  }
];

var viewer = null;
var curIdx = 0;
var transitioning = false;
var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 600;
var BASE_HFOV = isMobile ? 90 : 100;

(function () {
  var ls = document.getElementById('loadScreen');
  if (ls) ls.style.display = 'none';
}());

function buildHotspots(sceneIdx) {
  return SCENES[sceneIdx].hotspots.map(function (hs) {
    return {
      pitch: hs.pitch, yaw: hs.yaw, type: 'custom', cssClass: 'hs-wrap',
      createTooltipFunc: function (el) {
        el.innerHTML =
          '<div class="hs-circle">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none">' +
              '<path d="M12 5l7 7-7 7M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</div>' +
          '<span class="hs-label">' + hs.label + '</span>';
      },
      clickHandlerFunc: function () { goTo(hs.to); }
    };
  });
}

function initViewer(sceneIdx, onLoaded) {
  if (viewer) { viewer.destroy(); viewer = null; }
  viewer = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: SCENES[sceneIdx].src,
    autoLoad: true,
    autoRotate: -2,
    autoRotateInactivityDelay: 3000,
    showControls: false,
    mouseZoom: true,
    hfov: BASE_HFOV,
    minHfov: 60,
    maxHfov: 120,
    pitch: 0, yaw: 0,
    hotSpots: buildHotspots(sceneIdx)
  });
  if (typeof onLoaded === 'function') {
    viewer.on('load', function () { onLoaded(); });
    setTimeout(function () { onLoaded(); }, 8000);
  }
}

function goTo(idx) {
  if (idx === curIdx || transitioning) return;
  transitioning = true;
  curIdx = idx;
  updateNav(idx);
  document.getElementById('sceneName').textContent = SCENES[idx].name;
  var tr = document.getElementById('transition');
  tr.classList.add('active');
  setTimeout(function () {
    var done = false;
    function reveal() {
      if (done) return; done = true;
      tr.classList.remove('active');
      transitioning = false;
    }
    initViewer(idx, reveal);
  }, 360);
}

function updateNav(idx) {
  document.querySelectorAll('.sbtn').forEach(function (b) {
    b.classList.toggle('on', parseInt(b.dataset.scene) === idx);
  });
  document.querySelectorAll('.room-dot').forEach(function (d) {
    d.classList.toggle('active', d.id === 'dot-' + idx);
  });
}

function startTour() {
  var ov = document.getElementById('overlay');
  ov.classList.add('gone');
  setTimeout(function () { ov.style.display = 'none'; }, 950);
  setTimeout(function () { document.getElementById('hint').classList.add('gone'); }, 7000);
}

initViewer(0);

/* Planta: zoom no toque (mobile e desktop) */
(function () {
  var box = document.getElementById('plantaBox');
  if (!box) return;
  box.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    box.classList.add('zoomed');
  }, { passive: true });
  box.addEventListener('touchend', function () {
    setTimeout(function () { box.classList.remove('zoomed'); }, 800);
  });
}());
</script>
</body>
</html>
